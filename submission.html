<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Task 2 Submission</title>
  <style>
    @page {
      size: A4 portrait;
      margin: 10mm 12mm;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #0f172a;
      margin: 0;
      padding: 0;
    }
    .repo-banner {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 12px;
      font-size: 13px;
      word-break: break-all;
    }
    .repo-banner strong {
      color: #334155;
    }
    .repo-banner a {
      color: #059669;
      text-decoration: none;
      font-weight: 600;
    }
    .item {
      margin-bottom: 12px;
      text-align: center;
    }
    .img-card {
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      overflow: hidden;
      background: #ffffff;
      padding: 6px;
      display: inline-block;
      width: 100%;
      box-sizing: border-box;
    }
    img {
      width: 100%;
      max-height: 480px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }
    .item-2 img {
      max-height: 350px;
    }
  </style>
</head>
<body>

  <div class="repo-banner">
    <strong>GitHub Repository:</strong> 
    <a href="https://github.com/panharithhh/cheapanharith_Task-2-Style-Compose-the-Profile-Page-Lessons-1.6-1.9-">https://github.com/panharithhh/cheapanharith_Task-2-Style-Compose-the-Profile-Page-Lessons-1.6-1.9-</a>
  </div>

  <div class="item">
    <div class="img-card">
      <img src="screenshots/side_by_side.png" alt="Phone and Desktop Side by Side">
    </div>
  </div>

  <div class="item item-2">
    <div class="img-card">
      <img src="screenshots/project_cards.png" alt="Project Cards">
    </div>
  </div>

</body>
</html>
